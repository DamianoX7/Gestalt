<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestalt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Cormorant+Garamond:wght@600&family=Gowun+Batang&display=swap">
<style>
/* Layout: a sticky stage holds the poster drawn in its own 2576×1821 coordinate box; --u is one poster pixel.
   The page scrolls through a 560vh track and the scroll position drives a CSS scroll-timeline story. */
@property --u { syntax: '<length>'; inherits: true; initial-value: 0.5px; }
:root{
  color-scheme: dark;
  --ink: #06070d;            /* page ground */
  --night: #0b0f18;          /* stage fill */
  --line: #f4f0f8;           /* frame lines, sparkles */
  --text: #f3eff7;           /* captions */
  --halo: rgba(214, 206, 255, .62);
  --serif-caps: 'Bellefair', 'Cormorant Garamond', 'Times New Roman', serif;
  --serif: 'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif;
  --hangul: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
}
html, body { background: var(--ink); }
body { margin: 0; color: var(--text); overflow-x: clip; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

/* ---------- stage & coordinate system ---------- */
.story { position: relative; height: 560vh; height: 560svh; view-timeline: --story block; }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; container-type: size; container-name: stage; background: var(--night); }
.world { position: absolute; inset: 0;
  --u: min(100vw / 2576, 100vh / 1821);
  --u: min(100cqw / 2576, 100cqh / 1821); }
.scene { position: absolute; left: 50%; top: 50%; width: calc(2576 * var(--u)); height: calc(1821 * var(--u)); margin: calc(-910.5 * var(--u)) 0 0 calc(-1288 * var(--u)); }
.cam { position: absolute; inset: 0; transform-origin: 50% 46%; }
.fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.box { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u)); overflow: visible; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.l-sky, .l-land, .l-moon, .l-bolt, .cl, .title, .orbits, .subtitle, .quote, .l-dim, .l-cracks, .l-flash, .rim, .tag { will-change: transform, opacity; }

/* ---------- layers ---------- */
.veil { position: absolute; inset: 0; pointer-events: none;
  --bx: max(0px, calc(50% - 1288 * var(--u) + 1px)); --by: max(0px, calc(50% - 910.5 * var(--u) + 1px));
  background:
    linear-gradient(to left, rgba(6, 7, 13, 0), rgba(6, 7, 13, .72) calc(150 * var(--u))) left / var(--bx) 100% no-repeat,
    linear-gradient(to right, rgba(6, 7, 13, 0), rgba(6, 7, 13, .72) calc(150 * var(--u))) right / var(--bx) 100% no-repeat,
    linear-gradient(to top, rgba(6, 7, 13, 0), rgba(6, 7, 13, .72) calc(110 * var(--u))) top / 100% var(--by) no-repeat,
    linear-gradient(to bottom, rgba(6, 7, 13, 0), rgba(6, 7, 13, .72) calc(110 * var(--u))) bottom / 100% var(--by) no-repeat; }
.grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.l-mist { pointer-events: none; background:
  radial-gradient(26% 7% at 52% 71%, rgba(96, 126, 178, .2), rgba(96, 126, 178, 0) 100%),
  radial-gradient(20% 6% at 74% 86%, rgba(96, 136, 168, .16), rgba(96, 136, 168, 0) 100%); }
.l-dim { position: absolute; inset: -40%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side at 50% 50%, rgba(6, 7, 16, .5), rgba(3, 4, 9, .93)); }
.l-flash { position: absolute; inset: -40%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side at 50% 50%, rgba(232, 226, 255, .8), rgba(170, 160, 245, .32) 45%, rgba(130, 120, 230, 0) 100%); }

/* centre line & emblem (part of the art) */
.emblem path { fill: none; stroke: var(--line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- title ---------- */
.letters .sil { fill: #c3bfca; }
.letters .band { fill: url(#p-band); }
.letters .face { fill: url(#g-face); }
.orbits path { fill: none; stroke-linecap: round; stroke-dasharray: 1 1; }
.orbits .o-glow { stroke: rgba(214, 208, 255, .3); stroke-width: 7; }
.orbits .o-line { stroke: #f2eef7; stroke-width: 2.4; }
.cl path { fill-rule: evenodd; }

/* ---------- type ---------- */
.tx { margin: 0; white-space: nowrap; color: var(--text);
  text-shadow: 0 0 calc(7 * var(--u)) var(--halo), 0 0 calc(2 * var(--u)) rgba(255, 255, 255, .35); }
.subtitle { position: absolute; left: calc(992.3 * var(--u)); top: calc(871.9 * var(--u)); font-family: var(--serif); font-weight: 600; font-size: calc(62.4 * var(--u)); line-height: calc(62.4 * var(--u)); transform-origin: 50% 50%; }
.quote { position: absolute; left: calc(1062.6 * var(--u)); top: calc(1198.6 * var(--u)); font-family: var(--hangul); font-size: calc(40 * var(--u)); line-height: calc(64 * var(--u)); transform-origin: 52% 50%; }
.quote span { display: block; }
.quote::before { content: ''; position: absolute; inset: -46% -13%; z-index: -1; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(7, 8, 17, .97), rgba(7, 8, 17, .9) 52%, rgba(7, 8, 17, .5) 76%, rgba(7, 8, 17, 0)); }
.quote .q1 { letter-spacing: -0.021em; }
.quote .q2 { padding-left: calc(33.8 * var(--u)); letter-spacing: -0.003em; }

/* ---------- HUD: frame and captions, placed in stage space so phones can re-anchor them ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; }
.rim { position: absolute;
  left: calc(50% - 1234 * var(--u)); right: calc(50% - 1232 * var(--u));
  top: calc(50% - 847.5 * var(--u)); bottom: calc(50% - 845.5 * var(--u)); }
.rim i { position: absolute; display: block; box-shadow: 0 0 calc(5 * var(--u)) rgba(226, 220, 255, .55); }
.rim .h { left: calc(-28 * var(--u)); right: calc(-28 * var(--u)); height: max(1px, calc(2.3 * var(--u))); margin-top: calc(-1.15 * var(--u));
  background: linear-gradient(90deg, rgba(244, 240, 248, 0), var(--line) 1.2%, var(--line) 98.8%, rgba(244, 240, 248, 0)); }
.rim .h1 { top: 0; } .rim .h2 { top: 100%; }
.rim .v { width: max(1px, calc(2.3 * var(--u))); margin-left: calc(-1.15 * var(--u)); }
.rim .v1, .rim .v3 { top: calc(33 * var(--u)); bottom: calc(50% + 15 * var(--u));
  background: linear-gradient(180deg, rgba(244, 240, 248, .4), var(--line) 10%, var(--line) 86%, rgba(244, 240, 248, 0)); }
.rim .v2, .rim .v4 { top: calc(50% + 15 * var(--u)); bottom: calc(34 * var(--u));
  background: linear-gradient(180deg, rgba(244, 240, 248, 0), var(--line) 11%, var(--line) 86%, rgba(244, 240, 248, .05)); }
.rim .v1, .rim .v2 { left: 0; } .rim .v3, .rim .v4 { left: 100%; }
.rim .dot { width: calc(11.2 * var(--u)); height: calc(11.2 * var(--u)); margin: calc(-5.6 * var(--u)) 0 0 calc(-5.6 * var(--u)); top: 50%; border-radius: 50%; background: #fbf9ff; }
.rim .d1 { left: 0; } .rim .d2 { left: 100%; }
.spark { position: absolute; width: calc(76 * var(--u)); height: calc(76 * var(--u)); margin: calc(-38 * var(--u)) 0 0 calc(-38 * var(--u)); overflow: visible; }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; animation: twinkle 6s ease-in-out infinite; }
.s-tl { left: 0; top: 0; } .s-tr { left: 100%; top: 0; } .s-bl { left: 0; top: 100%; } .s-br { left: 100%; top: 100%; }
.s-tr svg { animation-delay: -1.5s } .s-bl svg { animation-delay: -3s } .s-br svg { animation-delay: -4.5s }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1 } 50% { transform: scale(.88) rotate(5deg); opacity: .82 } }

.tag { position: absolute; }
.tag .tx { font-family: var(--serif-caps); font-size: calc(39.2 * var(--u)); line-height: calc(61 * var(--u)); font-weight: 400; }
.tag .dash { display: block; height: max(1px, calc(2 * var(--u))); width: calc(47 * var(--u)); margin-top: calc(13 * var(--u)); background: var(--line); box-shadow: 0 0 calc(5 * var(--u)) var(--halo); }
.tag-tr { right: calc(50% - 1182 * var(--u)); top: calc(50% - 70.6 * var(--u)); text-align: right; }
.tag-tr .dash, .tag-br .dash { margin-left: auto; }
.tag-bl { left: calc(50% - 1182.7 * var(--u)); top: calc(50% + 657.4 * var(--u)); }
.tag-br { right: calc(50% - 1182 * var(--u)); top: calc(50% + 657.4 * var(--u)); text-align: right; }
.tag-bl .moon-ico { position: absolute; left: calc(-17.3 * var(--u)); top: calc(-36 * var(--u)); width: calc(26 * var(--u)); height: calc(28 * var(--u)); overflow: visible; }
.tag-br .star-ico { position: absolute; right: calc(-25 * var(--u)); top: calc(-5 * var(--u)); width: calc(30 * var(--u)); height: calc(30 * var(--u)); overflow: visible; }

/* scroll cue: a glint that runs down the poster's own centre line */
.cue { position: absolute; left: calc(1282.5 * var(--u)); top: calc(1268 * var(--u)); width: 0; height: calc(488 * var(--u)); pointer-events: none; }
.cue i { position: absolute; left: calc(-4.5 * var(--u)); top: 0; width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: 50%; background: #fff;
  box-shadow: 0 0 calc(12 * var(--u)) calc(4 * var(--u)) rgba(214, 206, 255, .85); animation: cue-run 2.6s cubic-bezier(.55, 0, .35, 1) infinite; }
@keyframes cue-run { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 80% { opacity: 1 } 100% { transform: translateY(calc(470 * var(--u))); opacity: 0 } }

/* ======================================================================
   Scroll story (CSS scroll-driven animations on the root scroller)
    0–3%   the poster at rest
    3–15%  tension: captions and frame slip away, glass starts to drift
   15–18%  lightning
   17–33%  the mirror shatters outward, the title lifts away
   30–60%  the quote alone; the impact cracks the screen
   60–92%  every shard flies home and the title re-forms
   92–100% the poster, whole again
   ====================================================================== */
.sd, .ck path, .orbits path, .tag-tr .tx, .quote::before {
  animation-duration: auto; animation-timing-function: linear; animation-fill-mode: both; animation-timeline: --story; animation-range: contain 0% contain 100%; }
@supports not (animation-timeline: view()) {
  .sd, .ck path, .orbits path, .tag-tr .tx, .quote::before { animation-duration: 1s; animation-play-state: paused; animation-delay: calc(var(--p, 0) * -1s); }
}
.cam      { animation-name: camera; }
.l-sky    { animation-name: sky; }
.l-moon   { animation-name: moon; }
.l-land   { animation-name: land; }
.l-bolt   { animation-name: bolt; }
.axis     { animation-name: fade-frame; }
.rim      { animation-name: fade-frame; }
.cl       { animation-name: burst; transform-origin: 50% 50%; }
.title    { animation-name: title; transform-origin: 50% 36%; }
.orbits path { animation-name: orbit; }
.subtitle { animation-name: subtitle; }
.tag-bl   { animation-name: tag-l; }
.tag-tr, .tag-br { animation-name: tag-r; }
.tag-tr .tx { animation-name: echo; }
.quote    { animation-name: quote; }
.quote::before { animation-name: plate; }
.l-dim    { animation-name: dim; }
.l-cracks { animation-name: cracks; transform-origin: 64.4% 48.4%; }
.ck1 path { animation-name: ck1; } .ck2 path { animation-name: ck2; } .ck3 path { animation-name: ck3; } .ck0 { animation-name: facets; }
.l-flash  { animation-name: flash; }
.cue      { animation-name: cue; }

@keyframes camera { 0%, 3% { transform: none; animation-timing-function: cubic-bezier(.4, 0, .6, 1) } 34% { transform: scale(1.07) translateY(calc(24 * var(--u))) } 60% { transform: scale(1.12) translateY(calc(16 * var(--u))); animation-timing-function: cubic-bezier(.45, 0, .2, 1) } 94%, 100% { transform: none } }
@keyframes sky    { 0%, 3% { transform: none } 34% { transform: translateY(calc(60 * var(--u))) scale(1.03) } 60% { transform: translateY(calc(76 * var(--u))) scale(1.04); animation-timing-function: cubic-bezier(.45, 0, .2, 1) } 94%, 100% { transform: none } }
@keyframes land   { 0%, 3% { transform: none; animation-timing-function: cubic-bezier(.4, 0, .4, 1) } 34% { transform: translateY(calc(240 * var(--u))) } 60% { transform: translateY(calc(280 * var(--u))); animation-timing-function: cubic-bezier(.45, 0, .2, 1) } 94%, 100% { transform: none } }
@keyframes moon   { 0%, 3% { transform: none } 34% { transform: translate(calc(-140 * var(--u)), calc(56 * var(--u))) scale(1.1) } 60% { transform: translate(calc(-160 * var(--u)), calc(64 * var(--u))) scale(1.14); animation-timing-function: cubic-bezier(.45, 0, .2, 1) } 94%, 100% { transform: none } }
@keyframes bolt   { 0%, 15% { opacity: .7 } 15.6% { opacity: 1 } 16.4% { opacity: .25 } 17.2% { opacity: 1 } 21% { opacity: .7 } 100% { opacity: .7 } }
@keyframes fade-frame { 0%, 3% { opacity: 1; transform: none } 14% { opacity: 0; transform: scale(1.04) } 85% { opacity: 0; transform: scale(1.04) } 96%, 100% { opacity: 1; transform: none } }
@keyframes burst  {
  0%, 3% { transform: none; animation-timing-function: cubic-bezier(.35, 0, .65, 1) }
  15.5% { transform: translate(calc(var(--dx) * .09), calc(var(--dy) * .09)) rotate(calc(var(--rz) * .2)); animation-timing-function: cubic-bezier(.2, .66, .3, 1) }
  33% { transform: translate(var(--dx), var(--dy)) rotate(var(--rz)) scale(var(--sc)) }
  64% { transform: translate(var(--dx2), var(--dy2)) rotate(var(--rz2)) scale(var(--sc)); animation-timing-function: cubic-bezier(.55, 0, .1, 1) }
  92%, 100% { transform: none }
}
@keyframes title  { 0%, 4% { opacity: 1; transform: none } 18% { opacity: 1; transform: translateY(calc(-20 * var(--u))) } 33% { opacity: 0; transform: translateY(calc(-90 * var(--u))) scale(.92) } 70% { opacity: 0; transform: translateY(calc(50 * var(--u))) scale(1.05); animation-timing-function: cubic-bezier(.2, .6, .3, 1) } 88%, 100% { opacity: 1; transform: none } }
@keyframes orbit  { 0%, 4% { stroke-dashoffset: 0 } 20% { stroke-dashoffset: 1 } 76% { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.3, 0, .2, 1) } 92%, 100% { stroke-dashoffset: 0 } }
@keyframes subtitle { 0%, 3% { opacity: 1; transform: none } 13% { opacity: 0; transform: scaleX(1.1) } 82% { opacity: 0; transform: scaleX(1.1) } 93%, 100% { opacity: 1; transform: none } }
@keyframes tag-l  { 0%, 3% { opacity: 1; transform: none } 12% { opacity: 0; transform: translateX(calc(-40 * var(--u))) } 86% { opacity: 0; transform: translateX(calc(-40 * var(--u))) } 97%, 100% { opacity: 1; transform: none } }
@keyframes tag-r  { 0%, 3% { opacity: 1; transform: none } 12% { opacity: 0; transform: translateX(calc(40 * var(--u))) } 86% { opacity: 0; transform: translateX(calc(40 * var(--u))) } 97%, 100% { opacity: 1; transform: none } }
@keyframes echo   { 0%, 95% { text-shadow: 0 0 calc(7 * var(--u)) var(--halo), 0 0 calc(2 * var(--u)) rgba(255, 255, 255, .35) }
                    98% { text-shadow: 0 0 calc(18 * var(--u)) rgba(200, 238, 255, .95), 0 0 calc(5 * var(--u)) #fff }
                    100% { text-shadow: 0 0 calc(7 * var(--u)) var(--halo), 0 0 calc(2 * var(--u)) rgba(255, 255, 255, .35) } }
@keyframes quote  { 0%, 28% { transform: none; animation-timing-function: cubic-bezier(.3, 0, .2, 1) } 42% { transform: translate(calc(-14 * var(--u)), calc(-336 * var(--u))) scale(1.6) } 60% { transform: translate(calc(-14 * var(--u)), calc(-340 * var(--u))) scale(1.64); animation-timing-function: cubic-bezier(.5, 0, .3, 1) } 75%, 100% { transform: none } }
@keyframes plate  { 0%, 40% { opacity: 0 } 46%, 58% { opacity: 1 } 66%, 100% { opacity: 0 } }
@keyframes dim    { 0%, 29% { opacity: 0 } 41%, 60% { opacity: 1 } 70%, 100% { opacity: 0 } }
@keyframes cracks { 0%, 41.5% { opacity: 0; transform: none } 42% { opacity: 1; transform: none } 59% { opacity: 1; transform: none } 67% { opacity: 0; transform: scale(1.18) } 100% { opacity: 0; transform: scale(1.18) } }
@keyframes ck1    { 0%, 42% { stroke-dashoffset: 1 } 47% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
@keyframes ck2    { 0%, 45% { stroke-dashoffset: 1 } 51% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
@keyframes ck3    { 0%, 47% { stroke-dashoffset: 1 } 53% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
@keyframes facets { 0%, 44% { opacity: 0 } 50% { opacity: 1 } 100% { opacity: 1 } }
@keyframes flash  { 0%, 15.2% { opacity: 0 } 15.8% { opacity: .8 } 16.6% { opacity: .1 } 17.4% { opacity: .65 } 21% { opacity: 0 } 41.6% { opacity: 0 } 42.2% { opacity: .9 } 46% { opacity: 0 } 100% { opacity: 0 } }
@keyframes cue    { 0% { opacity: 1 } 3%, 100% { opacity: 0 } }

.tl-edge{--dx:calc(-1143.3*var(--u));--dy:calc(-508.6*var(--u));--dx2:calc(-1326.3*var(--u));--dy2:calc(-550*var(--u));--rz:-18deg;--rz2:-27deg;--sc:1.4;--px:690;--py:-330}
.tl-low{--dx:calc(-1148.8*var(--u));--dy:calc(-173.1*var(--u));--dx2:calc(-1332.6*var(--u));--dy2:calc(-160.8*var(--u));--rz:16deg;--rz2:24deg;--sc:1.4;--px:700;--py:560}
.tl-mid{--dx:calc(-899.7*var(--u));--dy:calc(-32.3*var(--u));--dx2:calc(-1043.6*var(--u));--dy2:calc(2.5*var(--u));--rz:-10deg;--rz2:-15deg;--sc:1.2;--px:450;--py:-690}
.tl-top{--dx:calc(-596.7*var(--u));--dy:calc(-717.3*var(--u));--dx2:calc(-692.2*var(--u));--dy2:calc(-792.1*var(--u));--rz:14deg;--rz2:21deg;--sc:1.2;--px:330;--py:-40}
.tr-low{--dx:calc(1092.4*var(--u));--dy:calc(67.7*var(--u));--dx2:calc(1267.1*var(--u));--dy2:calc(118.5*var(--u));--rz:-12deg;--rz2:-18deg;--sc:1.2;--px:-690;--py:430}
.tr-mid{--dx:calc(379.3*var(--u));--dy:calc(-643*var(--u));--dx2:calc(440*var(--u));--dy2:calc(-705.9*var(--u));--rz:8deg;--rz2:12deg;--sc:1.1;--px:170;--py:820}
.tr-pane{--dx:calc(1026.1*var(--u));--dy:calc(-496.3*var(--u));--dx2:calc(1190.3*var(--u));--dy2:calc(-535.7*var(--u));--rz:12deg;--rz2:18deg;--sc:1.4;--px:-560;--py:-300}
.tr-sliver{--dx:calc(792.7*var(--u));--dy:calc(-575.9*var(--u));--dx2:calc(919.6*var(--u));--dy2:calc(-628.1*var(--u));--rz:-22deg;--rz2:-33deg;--sc:1.5;--px:-470;--py:-215}
.tr-top{--dx:calc(459*var(--u));--dy:calc(-749.3*var(--u));--dx2:calc(532.4*var(--u));--dy2:calc(-829.2*var(--u));--rz:-9deg;--rz2:-13.5deg;--sc:1.2;--px:-90;--py:-300}
.fg-b1{--dx:calc(-976.8*var(--u));--dy:calc(1080.2*var(--u));--dx2:calc(-1133.1*var(--u));--dy2:calc(1293*var(--u));--rz:-6deg;--rz2:-9deg;--sc:1.6;--px:680;--py:560}
.fg-b2{--dx:calc(-20*var(--u));--dy:calc(1265.6*var(--u));--dx2:calc(-23.2*var(--u));--dy2:calc(1508.1*var(--u));--rz:4deg;--rz2:6deg;--sc:1.6;--px:60;--py:640}
.fg-b3{--dx:calc(804.8*var(--u));--dy:calc(1155.9*var(--u));--dx2:calc(933.6*var(--u));--dy2:calc(1380.9*var(--u));--rz:7deg;--rz2:10.5deg;--sc:1.6;--px:-270;--py:560}
.fg-left{--dx:calc(-1361.7*var(--u));--dy:calc(619*var(--u));--dx2:calc(-1579.5*var(--u));--dy2:calc(758*var(--u));--rz:-8deg;--rz2:-12deg;--sc:1.7;--px:590;--py:380}
.fg-right{--dx:calc(1271.9*var(--u));--dy:calc(857.1*var(--u));--dx2:calc(1475.4*var(--u));--dy2:calc(1034.2*var(--u));--rz:10deg;--rz2:15deg;--sc:1.7;--px:-700;--py:420}

.l-cracks path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
.ck1 path { stroke: #f5f2ff; stroke-width: 2.4; }
.ck2 path { stroke: rgba(236, 232, 255, .78); stroke-width: 1.5; }
.ck3 path { stroke: rgba(164, 240, 232, .72); stroke-width: 1.3; }
.ck0 { opacity: 0; }

/* ---------- phones and other tall screens: re-compose the poster vertically ---------- */
@media (max-aspect-ratio: 17/20) {
  .world { --u: min(100vw / 1330, 100vh / 2400); --u: min(100cqw / 1330, 100cqh / 2400); }
  .l-sky  { translate: calc(360 * var(--u)) calc(-60 * var(--u)); }
  .l-land { translate: calc(240 * var(--u)) calc(150 * var(--u)); }
  .l-moon { translate: calc(-450 * var(--u)) calc(-220 * var(--u)); }
  .l-bolt { visibility: hidden; }
  .fg-right { visibility: hidden; }
  .cl { translate: calc(var(--px, 0) * var(--u)) calc(var(--py, 0) * var(--u)); }
  .rim { left: 16px; right: 16px; top: 20px; bottom: 20px; }
  .veil { display: none; }
  .tag-bl { left: calc(16px + 52 * var(--u)); top: auto; bottom: calc(20px + 62 * var(--u)); }
  .tag-br { right: calc(16px + 52 * var(--u)); top: auto; bottom: calc(20px + 62 * var(--u)); }
  .tag-tr { right: calc(16px + 52 * var(--u)); top: auto; bottom: calc(20px + 420 * var(--u)); }

/* ======================================================================
   Reel: after the poster comes back together, the trailer opens out of
   a small window in the dark and grows to fill the screen.
   ====================================================================== */
.reel { position: relative; height: 300vh; height: 300svh; background: var(--ink); view-timeline: --reel block; }
.reel-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; display: grid; place-items: center; }
.screen { position: absolute; inset: 0; background: #000; clip-path: inset(30% 34% 30% 34%); }
.screen video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); }
.screen::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(closest-side at 50% 50%, rgba(6, 7, 13, 0) 62%, rgba(6, 7, 13, .55)); }
.reel-rim { position: absolute; inset: 30% 34%; pointer-events: none; border: 1px solid rgba(244, 240, 248, .75);
  box-shadow: 0 0 14px rgba(214, 206, 255, .35), inset 0 0 14px rgba(214, 206, 255, .2); }
.reel-cap { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; color: var(--text);
  font-family: var(--serif-caps); letter-spacing: .32em; text-indent: .32em; font-size: clamp(11px, 1.05vw, 16px);
  text-shadow: 0 0 8px var(--halo); }
.reel-cap.top { top: calc(30% - 3.2em); }
.reel-cap.bottom { bottom: calc(30% - 3.2em); font-family: var(--hangul); letter-spacing: .12em; text-indent: .12em; }
.rd { animation-duration: auto; animation-timing-function: linear; animation-fill-mode: both; animation-timeline: --reel; animation-range: contain 0% contain 100%; }
@supports not (animation-timeline: view()) {
  .rd { animation-duration: 1s; animation-play-state: paused; animation-delay: calc(var(--p, 0) * -1s); }
}
.screen.rd { animation-name: reel-open; }
.screen video.rd { animation-name: reel-zoom; }
.reel-rim.rd { animation-name: reel-rim; }
.reel-cap.rd { animation-name: reel-cap; }
@keyframes reel-open { 0%, 10% { clip-path: inset(30% 34% 30% 34%) } 48%, 100% { clip-path: inset(0 0 0 0) } }
@keyframes reel-zoom { 0%, 10% { transform: scale(1.18) } 48%, 100% { transform: scale(1) } }
@keyframes reel-rim  { 0%, 10% { inset: 30% 34%; opacity: 1 } 40% { opacity: .6 } 48%, 100% { inset: 0; opacity: 0 } }
@keyframes reel-cap  { 0%, 3% { opacity: 1; transform: none } 11%, 100% { opacity: 0; transform: translateY(-12px) } }
@media (max-aspect-ratio: 17/20) {
  .screen { clip-path: inset(36% 12% 36% 12%); }
  .reel-rim { inset: 36% 12%; }
  .reel-cap.top { top: calc(36% - 3.2em); } .reel-cap.bottom { bottom: calc(36% - 3.2em); }
  @keyframes reel-open { 0%, 10% { clip-path: inset(36% 12% 36% 12%) } 48%, 100% { clip-path: inset(0 0 0 0) } }
  @keyframes reel-rim  { 0%, 10% { inset: 36% 12%; opacity: 1 } 40% { opacity: .6 } 48%, 100% { inset: 0; opacity: 0 } }
}

@media (prefers-reduced-motion: reduce) {
  .story { height: 100vh; height: 100svh; }
  .reel { height: 100vh; height: 100svh; }
  .rd { animation: none !important; }
  .screen { clip-path: none; } .screen video { transform: none; }
  .reel-rim, .reel-cap { display: none; }
  .sd, .ck path, .orbits path, .tag-tr .tx, .quote::before, .cue i, .spark svg { animation: none !important; }
  .cue { display: none; }
}

    <p class="reel-cap bottom rd" lang="ko">거울 너머</p>
  </div>
</section>

<script>
/* Play the trailer only while it is on screen. */
(() => {
  const v = document.querySelector('.reel video');
  if (!v) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) v.controls = true;
  if (!('IntersectionObserver' in window)) { if (!reduce) v.play().catch(() => {}); return; }
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting && !reduce) v.play().catch(() => {});
    else if (!e.isIntersecting) v.pause();
  }, { threshold: 0.15 }).observe(v.closest('.reel-stage'));
})();

/* Browsers without CSS scroll/view timelines: feed each section's scroll progress into its
   own --p, which the @supports fallbacks above turn into a paused animation with a negative delay. */
(() => {
  if (window.CSS && CSS.supports && CSS.supports('animation-timeline: view()')) return;
  const tracks = [...document.querySelectorAll('.story, .reel')];
  let queued = false;
  const update = () => {
    queued = false;
    for (const el of tracks) {
      const r = el.getBoundingClientRect();
      const span = r.height - window.innerHeight;
      const p = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
      el.style.setProperty('--p', p.toFixed(4));
    }
  };
  const request = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  update();
})();
</script>
